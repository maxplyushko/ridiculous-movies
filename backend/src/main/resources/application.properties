spring.application.name=backend
spring.profiles.default=prod
server.port=${PORT:8080}
google.drive.file-id=${GOOGLE_DRIVE_FILE_ID:}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.web-app-url=${TELEGRAM_WEB_APP_URL:https://ridiculous-movies.onrender.com}
telegram.bot.webhook-url=${TELEGRAM_WEBHOOK_URL:https://ridiculous-movies.onrender.com/api/telegram/webhook}
telegram.bot.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.bot.start-message=${TELEGRAM_START_MESSAGE:Movie Time! Tap the button below to open the app}
telegram.bot.start-button-text=${TELEGRAM_START_BUTTON_TEXT:Open App}
telegram.bot.menu-button-text=${TELEGRAM_MENU_BUTTON_TEXT:Movie Time}
telegram.bot.start-photo-url=${TELEGRAM_START_PHOTO_URL:}
tmdb.api-key=${TMDB_API_KEY:}
jwt.secret=${JWT_SECRET:}
jwt.expiry-days=${JWT_EXPIRY_DAYS:30}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:https://ridiculous-movies.onrender.com/api/auth/google/callback}
